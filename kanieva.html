<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>Kanieva AI — Your Personal Travel Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #1c2230;
  --bg4: #222c3c;
  --accent: #7c6af5;
  --accent2: #9d8fff;
  --accent-glow: rgba(124,106,245,0.25);
  --accent-soft: rgba(124,106,245,0.12);
  --teal: #00c9a7;
  --teal-soft: rgba(0,201,167,0.12);
  --gold: #f5c842;
  --gold-soft: rgba(245,200,66,0.12);
  --red: #f0576a;
  --green: #3dd68c;
  --tx: #e6edf3;
  --tx2: #8b949e;
  --tx3: #484f58;
  --br: rgba(255,255,255,0.07);
  --br2: rgba(255,255,255,0.12);
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 8px 40px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
body{display:flex;flex-direction:column;position:relative}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity 0.6s,transform 0.6s}
#splash.hide{opacity:0;transform:scale(1.04);pointer-events:none}
.splash-orb{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--teal));display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 0 60px var(--accent-glow),0 0 120px rgba(0,201,167,0.15);animation:pulse-orb 2s ease-in-out infinite}
@keyframes pulse-orb{0%,100%{box-shadow:0 0 60px var(--accent-glow),0 0 120px rgba(0,201,167,0.15)}50%{box-shadow:0 0 80px rgba(124,106,245,0.4),0 0 160px rgba(0,201,167,0.25)}}
.splash-orb svg{width:48px;height:48px;fill:white}
.splash-title{font-size:28px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(135deg,#fff 40%,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.splash-sub{font-size:14px;color:var(--tx2);margin-top:8px;letter-spacing:0.3px}
.splash-dots{display:flex;gap:6px;margin-top:32px}
.splash-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0.3;animation:dot-bounce 1.2s ease-in-out infinite}
.splash-dots span:nth-child(2){animation-delay:0.2s}
.splash-dots span:nth-child(3){animation-delay:0.4s}
@keyframes dot-bounce{0%,100%{opacity:0.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

/* ── LAYOUT ── */
#app{display:none;flex-direction:column;height:100%;height:100dvh}
#app.show{display:flex}

/* ── HEADER ── */
#hdr{background:var(--bg2);border-bottom:1px solid var(--br);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;position:relative;z-index:10}
.hdr-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--teal));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 16px var(--accent-glow)}
.hdr-avatar svg{width:20px;height:20px;fill:white}
.hdr-info{flex:1;min-width:0}
.hdr-name{font-size:15px;font-weight:700;color:var(--tx);letter-spacing:-0.2px}
.hdr-status{font-size:11px;color:var(--teal);display:flex;align-items:center;gap:4px;margin-top:1px}
.hdr-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
.hdr-actions{display:flex;gap:8px}
.hdr-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--br2);background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx2);transition:all 0.15s}
.hdr-btn:active{background:var(--bg4);color:var(--tx)}

/* ── MESSAGES ── */
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#msgs::-webkit-scrollbar{width:0}

/* ── MESSAGE BUBBLES ── */
.msg{display:flex;gap:10px;animation:msg-in 0.3s ease-out}
@keyframes msg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;margin-top:2px}
.msg-avatar.ai{background:linear-gradient(135deg,var(--accent),var(--teal));box-shadow:0 0 12px var(--accent-glow)}
.msg-avatar.ai svg{width:16px;height:16px;fill:white}
.msg-avatar.user{background:var(--bg4);border:1px solid var(--br2);color:var(--tx2)}
.msg-body{max-width:82%;display:flex;flex-direction:column;gap:4px}
.msg.user .msg-body{align-items:flex-end}
.msg-bubble{padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.6;word-wrap:break-word}
.msg.ai .msg-bubble{background:var(--bg2);border:1px solid var(--br);border-bottom-left-radius:6px;color:var(--tx)}
.msg.user .msg-bubble{background:linear-gradient(135deg,var(--accent),#6458e8);color:white;border-bottom-right-radius:6px}
.msg-time{font-size:10px;color:var(--tx3);padding:0 4px;font-family:'DM Mono',monospace}

/* ── OPTION CHIPS ── */
.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;max-width:320px}
.opt-chip{padding:10px 12px;border-radius:12px;border:1px solid var(--br2);background:var(--bg3);color:var(--tx2);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;text-align:left;line-height:1.3;display:flex;align-items:center;gap:7px}
.opt-chip:active,.opt-chip:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--tx)}
.opt-chip .chip-icon{font-size:16px;flex-shrink:0}

/* ── BOOKING FORM IN CHAT ── */
.form-card{background:var(--bg2);border:1px solid var(--br2);border-radius:var(--radius);padding:16px;margin-top:4px;max-width:340px;width:100%}
.form-card-title{font-size:13px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.form-field{margin-bottom:12px}
.form-label{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:5px;display:block}
.form-input{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--br2);border-radius:10px;color:var(--tx);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s;-webkit-appearance:none}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:var(--tx3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-submit{width:100%;margin-top:4px;padding:12px;background:linear-gradient(135deg,var(--accent),#6458e8);border:none;border-radius:12px;color:white;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;box-shadow:0 4px 16px var(--accent-glow)}
.form-submit:active{transform:scale(0.98)}

/* ── PACKAGE CARDS ── */
.pkg-cards{display:flex;flex-direction:column;gap:10px;margin-top:4px;max-width:340px}
.pkg-card{background:var(--bg2);border:1px solid var(--br2);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.pkg-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--teal))}
.pkg-card.gold-pkg::before{background:linear-gradient(90deg,var(--gold),#f59e42)}
.pkg-card.teal-pkg::before{background:linear-gradient(90deg,var(--teal),#00e5c5)}
.pkg-card:active{transform:scale(0.98);border-color:var(--accent)}
.pkg-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent2);margin-bottom:10px}
.pkg-card.gold-pkg .pkg-badge{background:var(--gold-soft);color:var(--gold)}
.pkg-card.teal-pkg .pkg-badge{background:var(--teal-soft);color:var(--teal)}
.pkg-name{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:4px}
.pkg-desc{font-size:12px;color:var(--tx2);line-height:1.5;margin-bottom:12px}
.pkg-features{list-style:none;margin-bottom:14px}
.pkg-features li{font-size:12px;color:var(--tx2);padding:3px 0;display:flex;align-items:center;gap:6px}
.pkg-features li::before{content:'✓';color:var(--teal);font-weight:700;flex-shrink:0}
.pkg-footer{display:flex;align-items:center;justify-content:space-between}
.pkg-price{font-size:20px;font-weight:700;color:var(--tx)}
.pkg-price span{font-size:12px;color:var(--tx2);font-weight:400}
.pkg-select-btn{padding:8px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;background:var(--accent-soft);color:var(--accent2);transition:all 0.15s}
.pkg-card.gold-pkg .pkg-select-btn{background:var(--gold-soft);color:var(--gold)}
.pkg-card.teal-pkg .pkg-select-btn{background:var(--teal-soft);color:var(--teal)}

/* ── PAYMENT CARD ── */
.pay-card{background:var(--bg2);border:1px solid var(--br2);border-radius:var(--radius);padding:20px;max-width:340px;width:100%}
.pay-title{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:4px}
.pay-sub{font-size:12px;color:var(--tx2);margin-bottom:16px}
.pay-amount{font-size:32px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
.pay-breakdown{background:var(--bg3);border-radius:12px;padding:12px;margin-bottom:16px}
.pay-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
.pay-row:not(:last-child){border-bottom:1px solid var(--br)}
.pay-row .label{color:var(--tx2)}
.pay-row .val{color:var(--tx);font-weight:500}
.pay-revolut-btn{width:100%;padding:14px;background:linear-gradient(135deg,#0075eb,#005ec4);border:none;border-radius:12px;color:white;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.pay-confirm-btn{width:100%;padding:12px;background:var(--teal-soft);border:1px solid rgba(0,201,167,0.3);border-radius:12px;color:var(--teal);font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}

/* ── CONFIRMATION ── */
.confirm-card{background:var(--bg2);border:1px solid rgba(0,201,167,0.3);border-radius:var(--radius);padding:20px;max-width:340px;width:100%;text-align:center}
.confirm-icon{width:56px;height:56px;border-radius:50%;background:var(--teal-soft);border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px}
.confirm-title{font-size:18px;font-weight:700;color:var(--tx);margin-bottom:6px}
.confirm-sub{font-size:13px;color:var(--tx2);margin-bottom:16px;line-height:1.5}
.confirm-ref{font-family:'DM Mono',monospace;font-size:12px;color:var(--teal);background:var(--teal-soft);padding:6px 14px;border-radius:20px;display:inline-block;margin-bottom:16px}
.confirm-details{background:var(--bg3);border-radius:12px;padding:12px;text-align:left}
.confirm-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
.confirm-row:not(:last-child){border-bottom:1px solid var(--br)}
.confirm-row .lbl{color:var(--tx2)}
.confirm-row .val{color:var(--tx);font-weight:500;text-align:right;max-width:60%}

/* ── TYPING INDICATOR ── */
.typing{display:flex;gap:10px;animation:msg-in 0.3s ease-out}
.typing-bubble{padding:12px 16px;background:var(--bg2);border:1px solid var(--br);border-radius:18px;border-bottom-left-radius:6px;display:flex;align-items:center;gap:4px}
.typing-bubble span{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:typing-bounce 1.2s ease-in-out infinite}
.typing-bubble span:nth-child(2){animation-delay:0.2s}
.typing-bubble span:nth-child(3){animation-delay:0.4s}
@keyframes typing-bounce{0%,100%{transform:translateY(0);opacity:0.4}50%{transform:translateY(-4px);opacity:1}}

/* ── INPUT BAR ── */
#input-bar{background:var(--bg2);border-top:1px solid var(--br);padding:10px 12px;padding-bottom:max(10px, env(safe-area-inset-bottom));flex-shrink:0}
.input-wrap{display:flex;align-items:flex-end;gap:8px;background:var(--bg3);border:1px solid var(--br2);border-radius:24px;padding:8px 8px 8px 16px;transition:border-color 0.2s}
.input-wrap:focus-within{border-color:var(--accent)}
#user-input{flex:1;background:transparent;border:none;outline:none;color:var(--tx);font-size:15px;font-family:'Inter',sans-serif;resize:none;max-height:120px;line-height:1.5;padding:2px 0}
#user-input::placeholder{color:var(--tx3)}
#send-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#6458e8);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.15s;box-shadow:0 4px 12px var(--accent-glow)}
#send-btn:active{transform:scale(0.92)}
#send-btn svg{width:18px;height:18px;fill:white;transform:translateX(1px)}
#send-btn:disabled{opacity:0.4;cursor:default}

/* ── PROGRESS BAR ── */
.prog-bar{background:var(--bg2);border:1px solid var(--br2);border-radius:var(--radius-sm);padding:12px 14px;max-width:340px;margin-top:4px}
.prog-label{font-size:11px;color:var(--tx2);margin-bottom:6px;font-weight:500}
.prog-track{height:4px;background:var(--bg4);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));border-radius:99px;transition:width 0.4s ease}
.prog-steps{display:flex;justify-content:space-between;margin-top:6px}
.prog-step{font-size:9px;color:var(--tx3);font-family:'DM Mono',monospace}
.prog-step.done{color:var(--teal)}

/* ── SCROLLBAR ── */
#msgs{scrollbar-width:none}

/* ── QUICK REPLIES ── */
.quick-replies{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;max-width:340px}
.qr{padding:7px 13px;border-radius:20px;border:1px solid var(--br2);background:var(--bg3);color:var(--tx2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all 0.15s;flex-shrink:0}
.qr:active,.qr:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent2)}

/* ── UTILITY ── */
.text-accent{color:var(--accent2)}
.text-teal{color:var(--teal)}
.text-gold{color:var(--gold)}
strong{font-weight:600;color:var(--tx)}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-orb">
    <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
  </div>
  <div class="splash-title">Kanieva AI</div>
  <div class="splash-sub">Your Personal Travel Concierge</div>
  <div class="splash-dots">
    <span></span><span></span><span></span>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- HEADER -->
  <div id="hdr">
    <div class="hdr-avatar">
      <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
    </div>
    <div class="hdr-info">
      <div class="hdr-name">Kanieva AI</div>
      <div class="hdr-status">Online · Travel Concierge</div>
    </div>
    <div class="hdr-actions">
      <div class="hdr-btn" onclick="resetChat()" title="New Chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </div>
    </div>
  </div>

  <!-- MESSAGES -->
  <div id="msgs"></div>

  <!-- INPUT BAR -->
  <div id="input-bar">
    <div class="input-wrap">
      <textarea id="user-input" placeholder="Message Kanieva AI…" rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
const STATE = {
  stage: 'welcome',     // welcome | menu | form | packages | payment | confirmed
  formData: {},
  formStep: 0,
  selectedPackage: null,
  bookingRef: null
};

const FORM_FIELDS = [
  { key: 'name',       label: 'Full Name',           placeholder: 'e.g. Jane Smith',          type: 'text' },
  { key: 'email',      label: 'Email Address',        placeholder: 'e.g. jane@email.com',      type: 'email' },
  { key: 'from',       label: 'Flying From',          placeholder: 'e.g. London, UK',          type: 'text' },
  { key: 'to',         label: 'Destination',          placeholder: 'e.g. Bali, Indonesia',     type: 'text' },
  { key: 'depart',     label: 'Departure Date',       placeholder: 'e.g. 15 July 2025',        type: 'text' },
  { key: 'returnDate', label: 'Return Date',          placeholder: 'e.g. 29 July 2025',        type: 'text' },
  { key: 'travelers',  label: 'Travelers',            placeholder: 'e.g. 2 adults, 1 child',   type: 'text' },
  { key: 'budget',     label: 'Budget Range',         placeholder: 'e.g. $3,000 – $5,000',    type: 'text' },
  { key: 'accomm',     label: 'Accommodation Type',   placeholder: 'e.g. Luxury hotel',        type: 'text' },
  { key: 'loyalty',    label: 'Loyalty Programs',     placeholder: 'e.g. Marriott Bonvoy (optional)', type: 'text' },
  { key: 'prefs',      label: 'Travel Preferences',   placeholder: 'e.g. Beaches, culture, food', type: 'text' },
  { key: 'visa',       label: 'Visa / Passport Notes', placeholder: 'e.g. US passport, no restrictions', type: 'text' },
  { key: 'special',    label: 'Special Requirements', placeholder: 'e.g. Vegetarian, wheelchair (optional)', type: 'text' }
];

const MENU_OPTIONS = [
  { icon: '🗺️', label: 'Destination Finder',      key: 'destination' },
  { icon: '📋', label: 'Itinerary Planner',        key: 'itinerary' },
  { icon: '✈️', label: 'Flight & Stay Finder',     key: 'flights' },
  { icon: '🎒', label: 'Packing List',             key: 'packing' },
  { icon: '💬', label: 'Language & Phrases',       key: 'language' },
  { icon: '💎', label: 'Hidden Gems Guide',        key: 'gems' },
  { icon: '💰', label: 'Travel Budget Planner',    key: 'budget' },
  { icon: '🔍', label: 'Advanced Flight Scout',    key: 'scout' }
];

// ─────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────
function now() {
  return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function scrollBottom() {
  const msgs = document.getElementById('msgs');
  requestAnimationFrame(() => msgs.scrollTop = msgs.scrollHeight);
}

function genRef() {
  return 'KNV-' + Math.random().toString(36).toUpperCase().slice(2,8);
}

// ─────────────────────────────────────────
// RENDER HELPERS
// ─────────────────────────────────────────
function aiMsg(htmlContent, extraClass = '') {
  const msgs = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = 'msg ai' + (extraClass ? ' ' + extraClass : '');
  d.innerHTML = `
    <div class="msg-avatar ai">
      <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
    </div>
    <div class="msg-body">
      <div class="msg-bubble">${htmlContent}</div>
      <div class="msg-time">${now()}</div>
    </div>`;
  msgs.appendChild(d);

function renderBookingForm() {
  const msgs = document.getElementById('msgs');
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';

  const body = document.createElement('div');
  body.className = 'msg-body';
  body.style.maxWidth = '100%';

  const card = document.createElement('div');
  card.className = 'form-card';
  card.innerHTML = `<div class="form-card-title">✈️ Trip Details</div>`;

  // Progress
  const progDiv = document.createElement('div');
  progDiv.innerHTML = `
    <div class="prog-label">Fill in your details below</div>
    <div class="prog-track"><div class="prog-fill" id="form-prog" style="width:0%"></div></div>
  `;
  card.appendChild(progDiv);

  // Fields
  const pairs = [
    ['name','email'],['from','to'],['depart','returnDate'],['travelers','budget'],['accomm','loyalty'],['prefs','visa'],['special']
  ];

  pairs.forEach(pair => {
    if (pair.length === 2) {
      const row = document.createElement('div');
      row.className = 'form-row';
      pair.forEach(k => row.appendChild(makeField(k)));
      card.appendChild(row);
    } else {
      card.appendChild(makeField(pair[0]));
    }
  });

  const submitBtn = document.createElement('button');
  submitBtn.className = 'form-submit';
  submitBtn.textContent = '🚀 Find My Trip Packages';
  submitBtn.onclick = submitBookingForm;
  card.appendChild(submitBtn);

  body.appendChild(card);
  wrap.appendChild(body);
  msgs.appendChild(wrap);
  scrollBottom();

  // Update progress on input
  document.querySelectorAll('.form-fi').forEach(inp => {
    inp.addEventListener('input', updateFormProgress);
  });
}

function makeField(key) {
  const f = FORM_FIELDS.find(x => x.key === key);
  const wrap = document.createElement('div');
  wrap.className = 'form-field';
  wrap.innerHTML = `
    <label class="form-label">${f.label}</label>
    <input class="form-input form-fi" type="${f.type}" placeholder="${f.placeholder}" data-key="${key}">
  `;
  return wrap;
}

function updateFormProgress() {
  const inputs = document.querySelectorAll('.form-fi');
  const filled = [...inputs].filter(i => i.value.trim()).length;
  const pct = Math.round((filled / inputs.length) * 100);
  const bar = document.getElementById('form-prog');
  if (bar) bar.style.width = pct + '%';
}

async function submitBookingForm() {
  const inputs = document.querySelectorAll('.form-fi');
  const required = ['name','email','from','to','depart','travelers'];
  let missing = [];

  inputs.forEach(inp => {
    STATE.formData[inp.dataset.key] = inp.value.trim();
  });

  required.forEach(k => {
    if (!STATE.formData[k]) missing.push(FORM_FIELDS.find(f=>f.key===k).label);
  });

  if (missing.length) {
    await aiReply(`Please fill in the required fields: <strong>${missing.join(', ')}</strong> to continue. 🙏`);
    return;
  }

  // Recap
  userMsg('I\'ve filled in my trip details');

  const fd = STATE.formData;
  await aiReply(`
    Perfect! Here's a summary of your trip details:<br><br>
    👤 <strong>${escHtml(fd.name)}</strong> (${escHtml(fd.email)})<br>
    ✈️ <strong>${escHtml(fd.from)}</strong> → <strong>${escHtml(fd.to)}</strong><br>

  await delay(2000);
  showPackages();

async function handleFreeText(text) {
  const t = text.toLowerCase();

  if (STATE.stage === 'confirmed') {
    if (t.includes('pack') || t.includes('bag')) return handleMenuOption(MENU_OPTIONS[3]);
    if (t.includes('gem') || t.includes('secret') || t.includes('hidden')) return handleMenuOption(MENU_OPTIONS[5]);
    if (t.includes('language') || t.includes('phrase')) return handleMenuOption(MENU_OPTIONS[4]);
  }

  // Travel-unrelated filter
  const travelWords = ['travel','trip','flight','hotel','book','visa','passport','destination','itinerary','pack','language','budget','price','cost','resort','beach','mountain','city','country','holiday','vacation','tour','guide','money','accommodation','airbnb','stay','explore'];
  const isTravel = travelWords.some(w => t.includes(w)) || STATE.stage !== 'welcome';

  if (!isTravel && STATE.stage === 'welcome') {
    await aiReply(`I'm here to assist with travel-related inquiries only. For other topics, I recommend using a different tool or service. Let me know if you have any travel-related questions! ✈️`);
    return;
  }

  // Generic helpful response
  if (t.includes('plan') || t.includes('trip') || t.includes('start')) {
    await aiReply(`Let's start planning! 🌍 I'll guide you through everything step by step. First, let me collect some details about your trip.`, 700);
    await delay(500);
    startBooking();
    return;
  }

  await aiReply(`Great question! I'm here to help. Could you tell me a bit more about what you're looking for? For example:<br><br>• Which destination are you interested in?<br>• What type of experience (relaxation, adventure, culture…)?<br>• When are you planning to travel?<br><br>Or tap any option above to get started! 🌟`, 900);
}

  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  userMsg(text);

  await handleFreeText(text);

  document.getElementById('send-btn').disabled = false;
}

// Auto-resize textarea
document.getElementById('user-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

document.getElementById('user-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ─────────────────────────────────────────
// RESET
// ─────────────────────────────────────────
function resetChat() {
  STATE.stage = 'welcome';
  STATE.formData = {};
  STATE.selectedPackage = null;
  STATE.bookingRef = null;
  document.getElementById('msgs').innerHTML = '';
  showWelcome();
}

// ─────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────
window.addEventListener('load', async () => {
  await delay(2000);
  document.getElementById('splash').classList.add('hide');
  await delay(600);
  document.getElementById('splash').style.display = 'none';
  document.getElementById('app').classList.add('show');
  showTyping();
  showWelcome();
});
</script>
</body>
</html>
